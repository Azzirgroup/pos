<!doctype html>
<html class="h-full" lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- viewport-fit=cover + user-scalable=no: a till must never pinch-zoom
		     or bounce when a cashier taps fast. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
		/>
		<title>TradeFlow</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="TradeFlow" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#171717" />

		<!--
			Installable as an app.

			The manifest and icons are served from the built asset directory, which
			is the only place this app controls; `start_url` and `scope` point at
			/pos so an installed window opens the till rather than the desk.

			iOS ignores the manifest for Add to Home Screen and reads the meta tags
			above plus this link, so the touch icon is declared separately rather
			than relied on from the manifest.
		-->
		<link rel="manifest" href="/assets/cosmestics/frontend/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/assets/cosmestics/frontend/icons/apple-touch-icon.png" />
		<link rel="icon" type="image/svg+xml" href="/assets/cosmestics/frontend/icons/icon.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/assets/cosmestics/frontend/icons/favicon-32.png"
		/>
	</head>
	<body class="h-full overscroll-none">
		<div id="app" class="h-full"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
