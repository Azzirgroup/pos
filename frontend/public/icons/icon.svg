<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
	<!--
		The same shopping-bag mark as the PNGs, kept in sync by eye rather than
		generated: this one is for anywhere a browser will take vector art, where
		it stays crisp at any size the PNGs would have to be re-rendered for.

		A bag rather than a letterform because a till app is recognised by what it
		does, and initials at 48px on a crowded home screen are a grey smudge.
	-->
	<rect width="512" height="512" rx="113" fill="#171717" />
	<g fill="none" stroke="#ffffff" stroke-width="27" stroke-linecap="round">
		<!-- Handle: upper half of a circle, meeting the body. -->
		<path d="M182 205 a74 74 0 0 1 148 0" />
	</g>
	<!-- Body: tapered, with rounded lower corners. -->
	<path
		d="M123 205 h266 l19 205 a26 26 0 0 1 -26 28 h-252 a26 26 0 0 1 -26 -28 z"
		fill="#ffffff"
	/>
</svg>
